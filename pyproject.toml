[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniloop"
version = "0.1.0.dev0"
description = "Planning scaffold for a Python tool-calling loop and read-only trajectory replay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["miniloop*"]
namespaces = false
